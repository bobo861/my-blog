baseURL: 'https://bobo861.pages.dev'
title: '我的博客'

paginate: 5
theme: PaperMod
languageCode: 'zh'
DefaultContentLanguage: 'zh'
hasCJKLanguage: true

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
enableGitInfo: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  title: '我的博客'
  description: '这是我的个人博客'
  author: 'bobo861'
  images: ['opengraph.webp']
  DateFormat: '2006-01-02'
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

  homeInfoParams:
    Title: "Hi there 👋"
    Content: 欢迎来到我的博客，这里记录我的学习与生活。

  socialIcons:
    - name: github
      url: 'https://github.com/bobo861'

  label:
    text: '我的博客'
    icon: /apple-touch-icon.png
    iconHeight: 35

  cover:
    hidden: true
    hiddenInList: true
    hiddenInSingle: true

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ['title', 'permalink', 'summary', 'content']

menu:
  main:
    - identifier: '首页'
      name: '首页'
      url: /
      weight: 1
    - identifier: '分类'
      name: '分类'
      url: /categories/
      weight: 10
    - identifier: '标签'
      name: '标签'
      url: /tags/
      weight: 20
    - identifier: 'GitHub'
      name: 'GitHub'
      url: https://github.com/bobo861
      weight: 30

pygmentsUseClasses: true
markup:
  highlight:
    noClasses: false